# 7. МУЗЫКАЛЬНЫЙ ШЕРИНГ И АГРЕГАТОРЫ ССЫЛОК (SONGLINK / ODESLI)
# ==============================================================================
  - DOMAIN-SUFFIX,song.link
  - DOMAIN-SUFFIX,odesli.co
  - DOMAIN-SUFFIX,album.link
  - DOMAIN-SUFFIX,artist.link
  - DOMAIN-SUFFIX,pods.link

# ==============================================================================
# 8. СЕТЕВОЙ УРОВЕНЬ, РОУТЕРЫ (OPENWRT) И АВТОРИЗАЦИЯ КЛИЕНТОВ
# ==============================================================================
# Фирменный порт Spotify Access Point Protocol (работает на роутерах вместо PROCESS-NAME)
  - DST-PORT,4070

# Прямые Anycast IP Google Cloud для подключения клиентов Spotify (с no-resolve для роутеров)
  - IP-CIDR,104.154.127.126/32,no-resolve
  - IP-CIDR,35.186.224.47/32,no-resolve

# Моды, спуфинг и утилиты
  - DOMAIN-KEYWORD,spotbye
  - DOMAIN-KEYWORD,spicetify
  - DOMAIN-KEYWORD,spotx
  - DOMAIN-SUFFIX,ipwho.is
  - DOMAIN-KEYWORD,ipwho

