# ==============================================================================
# SPOTIFY & ALL MUSIC SERVICES MASTER RULESET
# Объединенный и очищенный супер-набор правил для всей музыки:
# - Spotify (авторизация, веб-плеер, все CDN аудиопотоков, обложки, тексты, Anycast IP)
# - Tidal (Hi-Fi и Master качество, wimpmusic, S3 CDN)
# - Deezer (веб, приложение и dzcdn)
# - SoundCloud (треки, cdn, шортлинки snd.sc)
# - Qobuz (Hi-Res стриминг)
# - Bandcamp (портал артистов и аудиопотоки bcbits)
# - Тексты песен и распознавание (Genius, Musixmatch, Shazam, LRCLIB)
# - Метаданные и скробблинг (Last.fm, MusicBrainz, MetaBrainz, Songstats)
# - Агрегаторы ссылок (Songlink, Odesli, Album.link)
# - Моды, утилиты и рипперы FLAC (SpotiFLAC, Mornye, SpotX, Spicetify, Spotbye)
# БЕЗ опасных глобальных перехватов всего Akamai/Fastly и БЕЗ сбоев на роутерах!
# ==============================================================================

# ==============================================================================
# 1. SPOTIFY: АВТОРИЗАЦИЯ, САЙТ И СЕРВИСНЫЕ ССЫЛКИ
# ==============================================================================
  - DOMAIN-SUFFIX,spotify.com
  - DOMAIN-SUFFIX,spoti.fi
  - DOMAIN-SUFFIX,spotify.link
  - DOMAIN-SUFFIX,spotify.app.link
  - DOMAIN-SUFFIX,byspotify.com
  - DOMAIN-SUFFIX,tospotify.com
  - DOMAIN-SUFFIX,spotify-everywhere.com
  - DOMAIN-SUFFIX,spotifycharts.com
  - DOMAIN-SUFFIX,spotifycodes.com
  - DOMAIN-SUFFIX,spotifyforbrands.com
  - DOMAIN-SUFFIX,spotifyjobs.com
  - DOMAIN-SUFFIX,spotify.design
  - DOMAIN-SUFFIX,spotilocal.com
  - DOMAIN-SUFFIX,spotifynewsroom.jp
  - DOMAIN-KEYWORD,spotify

# ==============================================================================
# 2. SPOTIFY: СЕРВЕРЫ АУДИОПОТОКОВ, ОБЛОЖКИ И БЕЗОПАСНЫЙ CDN
# (Точечные поддомены Akamai/Fastly, исключающие перехват стороннего интернета)
# ==============================================================================
  - DOMAIN-SUFFIX,scdn.co
  - DOMAIN-SUFFIX,pscdn.co
  - DOMAIN-SUFFIX,spotifycdn.com
  - DOMAIN-SUFFIX,spotifycdn.net
  - DOMAIN-SUFFIX,audio-ak-spotify-com.akamaized.net
  - DOMAIN-SUFFIX,heads4-ak-spotify-com.akamaized.net
  - DOMAIN-SUFFIX,spotify-com.akamaized.net
  - DOMAIN,audio4-ak-spotify-com.akamaized.net
  - DOMAIN,heads-ak-spotify-com.akamaized.net
  - DOMAIN,spotify.com.edgesuite.net
  - DOMAIN,spotify.map.fastly.net
  - DOMAIN,spotify.map.fastlylb.net
  - DOMAIN,cdn-spotify-experiments.conductrics.com
  - DOMAIN,b.scorecardresearch.com

# ==============================================================================
