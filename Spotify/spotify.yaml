  - DOMAIN-SUFFIX,tunein.com

# ==============================================================================
# 5. BANDCAMP, ТЕКСТЫ ПЕСЕН (GENIUS/MUSIXMATCH) И ШАЗАМ
# ==============================================================================
  - DOMAIN-SUFFIX,bandcamp.com
  - DOMAIN-SUFFIX,bcbits.com
