# - Зеркала и шлюзы Qobuz (dabmusic.xyz, yeet.su, squid.wtf)
# - Зеркала Deezer и Amazon Music (deezmate.com, afkarxyz.fun)
# - Синхронизированные караоке-тексты песен LRCLIB
# - Метаданные и ISRC-статистика Songstats
# ==============================================================================
  - DOMAIN-SUFFIX,zarz.moe
  - DOMAIN-SUFFIX,mornye.com
  - DOMAIN-SUFFIX,streamhoarder.app
  - DOMAIN-SUFFIX,spotiflac.com
  - DOMAIN-KEYWORD,spotiflac
