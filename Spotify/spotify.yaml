  - DOMAIN-SUFFIX,tidalhifi.com
  - DOMAIN-SUFFIX,wimpmusic.com
  - DOMAIN-SUFFIX,tidal-cms.s3.amazonaws.com

# ==============================================================================
# 4. QOBUZ, DEEZER, SOUNDCLOUD, BEATPORT
# ==============================================================================
# Qobuz
  - DOMAIN-SUFFIX,qobuz.com
  - DOMAIN-SUFFIX,qobuz.net
